name: Supplier monitor
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger supplier monitor
        env:
          MONITOR_URL: ${{ secrets.MONITOR_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          test -n "$MONITOR_URL"
          test -n "$MONITOR_SECRET"
          curl --fail --silent --show-error -X POST "$MONITOR_URL" -H "Authorization: Bearer $MONITOR_SECRET"
