name: Supplier monitor
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
jobs:
  monitor:
    if: github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger supplier monitor
        env:
          MONITOR_URL: ${{ secrets.MONITOR_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          set -euo pipefail
          test -n "$MONITOR_URL"
          test -n "$MONITOR_SECRET"
          for batch in $(seq 1 100); do
            result=$(curl --fail --silent --show-error --connect-timeout 15 --max-time 300 -X POST "$MONITOR_URL" -H "Authorization: Bearer $MONITOR_SECRET")
            status=$(jq -r '.status' <<< "$result")
            test "$status" = completed
            remaining=$(jq -r '.remaining' <<< "$result")
            checked=$(jq -r '.checked' <<< "$result")
            echo "Batch $batch: checked=$checked remaining=$remaining"
            if [ "$remaining" = 0 ]; then exit 0; fi
          done
          echo "Monitor limit reached with pending sources" >&2
          exit 1
