[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify detects Next.js and installs its maintained OpenNext adapter.
# Configure database/auth/search secrets in the site's Functions environment.
# See docs/netlify-free.md before enabling the domain or the worker.
